<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Final Portfolio Candidate Audit</title><meta name="robots" content="noindex,nofollow"><style>body{font-family:system-ui,sans-serif;background:#f4f1ea;color:#181818;margin:0}.wrap{max-width:1100px;margin:auto;padding:40px 20px 80px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}.s,.panel{background:#fff;border:1px solid #d9d2c6;padding:18px}.s b{font-size:30px;display:block}.pass{color:#126b43}.fail{color:#a11}.row{padding:8px 0;border-bottom:1px solid #eee}.row:last-child{border:0}code{font-size:12px}@media(max-width:800px){.stats{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><h1>Final Portfolio Candidate Audit</h1><p>Checks the comprehensive evidence runtime, 18-case architecture, permanent-site wording, and design-source preservation. This audit does not mount the portfolio UI.</p><div id="out">Loading…</div></div><div id="final-candidate-error" style="display:none"></div><script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script><script>window.FINAL_AUDIT_ONLY=true;function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c])}async function render(){const st=window.FINAL_CANDIDATE_STATUS||{},arts=window.ARTIFACTS||[],cases=window.FINAL_EXECUTIVE_CASES||[],forbidden=/\b(Kaiser|KPSOM|CASO|WSCUC|BPPE)\b/i;const caseHits=cases.filter(c=>forbidden.test(JSON.stringify(c))).map(c=>c.title);const artifactHits=arts.filter(a=>forbidden.test([a.title,a.summary,a.strategic,a.role].join(' '))).map(a=>a.title);let preview='';try{preview=await fetch('final-preview.html?audit=1',{cache:'no-store'}).then(r=>r.text())}catch(e){}const designChecks=[['Newsreader font',preview.includes('family=Newsreader')],['Geist font',preview.includes('Geist')],['JetBrains Mono font',preview.includes('JetBrains+Mono')],['styles.css',preview.includes('styles.css?v=career-governance-v4')],['career-governance.css',preview.includes('career-governance.css?v=consultation-footprint-v1')],['nav-executive-drawer.css',preview.includes('nav-executive-drawer.css?v=executive-drawer-v1')],['No premium stylesheet',!preview.includes('premium.css')]];const allPass=st.baselineCount===97&&arts.length>97&&cases.length===18&&caseHits.length===0&&artifactHits.length===0&&designChecks.every(x=>x[1]);let h='<div class="stats"><div class="s"><b>'+esc(st.baselineCount)+'</b>preserved baseline</div><div class="s"><b>'+arts.length+'</b>total evidence records</div><div class="s"><b>'+cases.length+'</b>executive case studies</div><div class="s"><b class="'+(allPass?'pass':'fail')+'">'+(allPass?'PASS':'REVIEW')+'</b>overall audit</div></div>';h+='<div class="panel"><h2>Permanent-site wording</h2><div class="row '+(caseHits.length?'fail':'pass')+'">'+(caseHits.length?'✕':'✓')+' Case-study targeting terms: '+(caseHits.length?esc(caseHits.join('; ')):'none')+'</div><div class="row '+(artifactHits.length?'fail':'pass')+'">'+(artifactHits.length?'✕':'✓')+' Public artifact targeting terms: '+(artifactHits.length?esc(artifactHits.join('; ')):'none')+'</div></div>';h+='<div class="panel"><h2>Current-design preservation</h2>'+designChecks.map(x=>'<div class="row '+(x[1]?'pass':'fail')+'">'+(x[1]?'✓':'✕')+' '+esc(x[0])+'</div>').join('')+'</div>';h+='<div class="panel"><h2>Case architecture</h2>'+cases.map(c=>'<div class="row"><code>'+esc(c.num)+'</code> '+esc(c.title)+' · '+esc((c.evidence||[]).length)+' linked evidence IDs</div>').join('')+'</div>';document.getElementById('out').innerHTML=h}window.addEventListener('final-candidate-ready',render);window.addEventListener('final-candidate-failed',()=>{document.getElementById('out').innerHTML='<div class="panel fail">Runtime failed. Check loader error.</div>'});</script><script src="src/final-runtime-loader.js?v=2"></script></body></html>
