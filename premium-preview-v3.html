<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Ram Paragi — Premium Portfolio Review V3</title>
  <meta name="description" content="Deterministic premium review clone. Original live portfolio remains unchanged." />
  <meta name="robots" content="noindex,nofollow" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="career-governance.css" />
  <link rel="stylesheet" href="nav-executive-drawer.css" />
  <link rel="stylesheet" href="premium.css" />
  <style>
    #premium-loader-note{position:fixed;right:16px;bottom:16px;z-index:10000;background:#111;color:#fff;padding:9px 12px;border-radius:8px;font:12px/1.3 system-ui,sans-serif;box-shadow:0 8px 30px rgba(0,0,0,.22)}
    #premium-loader-note.ready{background:#0f5132} #premium-loader-note.fail{background:#842029}
  </style>
</head>
<body>
  <div id="root"></div>
  <div id="premium-loader-note">Loading premium evidence…</div>
  <div id="premium-runtime-error" style="display:none"></div>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
  <script>
    window.addEventListener('premium-runtime-status', function(e){
      var n=document.getElementById('premium-loader-note'); if(!n) return;
      var s=e.detail||{}; n.textContent='Premium runtime: '+s.phase+(s.premiumCount!=null?' · '+s.premiumCount+' records':'');
      if(s.phase==='app-mounted'){n.className='ready'; setTimeout(function(){n.style.display='none'},2500)}
      if(s.phase==='failed'){n.className='fail'}
    });
  </script>
  <script src="src/premium-runtime-loader.js?version=3"></script>
</body>
</html>
