<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium Evidence Runtime Audit V2</title><meta name="robots" content="noindex,nofollow"><style>body{font-family:Inter,system-ui,sans-serif;margin:0;background:#f6f4ef;color:#171717}.wrap{max-width:1180px;margin:0 auto;padding:40px 22px 80px}h1{font-size:34px;margin:0 0 8px}.lede{color:#666;max-width:800px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin:28px 0}.stat{background:white;border:1px solid #ddd8cf;border-radius:12px;padding:18px}.stat strong{font-size:30px;display:block}.ok{color:#146c43}.bad{color:#b02a37}.checks{background:#fff;border:1px solid #ddd8cf;border-radius:12px;padding:20px;margin:20px 0}.checks div{padding:6px 0;border-bottom:1px solid #eee}.checks div:last-child{border:0}.records{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.record{background:#fff;border:1px solid #e4dfd7;border-radius:8px;padding:10px 12px;font-size:13px}.record b{display:block}.new{border-left:4px solid #111}.base{opacity:.72}.error{white-space:pre-wrap;background:#fff0f0;border:1px solid #e6b8b8;padding:16px;border-radius:10px}@media(max-width:800px){.stats,.records{grid-template-columns:1fr}}</style></head><body><div class="wrap"><h1>Premium Evidence Runtime Audit V2</h1><p class="lede">Deterministic audit: the original portfolio stack loads first, then every premium evidence layer. This page does not mount the portfolio UI and does not modify the live site.</p><div id="audit"><p>Loading evidence runtime…</p></div></div><script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script><script>window.PREMIUM_AUDIT_ONLY=true;function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[c]})}function render(){var a=window.ARTIFACTS||[],s=window.PREMIUM_RUNTIME_SENTINEL||{},base=s.baseline||0,total=a.length,added=total-base,req=s.requiredIds||[],missing=req.filter(function(id){return !a.some(function(x){return x&&x.id===id})}),newCount=a.filter(function(x){return x&&(x.premiumEvidence||x.normalizedRecord)}).length;var html='<div class="stats"><div class="stat"><strong>'+total+'</strong>Total loaded records</div><div class="stat"><strong>'+base+'</strong>Baseline before premium</div><div class="stat"><strong>'+added+'</strong>Records added above baseline</div><div class="stat"><strong>'+newCount+'</strong>Premium/normalized records</div></div>';html+='<div class="checks"><h2 class="'+(s.ok&&!missing.length?'ok':'bad')+'">Runtime sentinel: '+(s.ok&&!missing.length?'PASS':'FAIL')+'</h2>';req.forEach(function(id){var hit=a.find(function(x){return x&&x.id===id});html+='<div>'+(hit?'✅':'❌')+' <code>'+esc(id)+'</code>'+(hit?' — '+esc(hit.title):' — MISSING')+'</div>'});html+='</div><h2>All loaded evidence records</h2><div class="records">';a.slice().sort(function(x,y){return String(x.title||'').localeCompare(String(y.title||''))}).forEach(function(x){var cls=(x.premiumEvidence||x.normalizedRecord)?'record new':'record base';html+='<div class="'+cls+'"><b>'+esc(x.title)+'</b><span>'+esc(x.id)+' · '+esc(x.category||'uncategorized')+'</span></div>'});html+='</div>';document.getElementById('audit').innerHTML=html}window.addEventListener('premium-runtime-ready',render);window.addEventListener('premium-runtime-failed',function(e){document.getElementById('audit').innerHTML='<div class="error"><b>Runtime failed</b>\n'+esc(JSON.stringify((e&&e.detail)||{},null,2))+'</div>'});</script><script src="src/premium-runtime-loader.js?version=3"></script></body></html>
