<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Evidence Record | Ram Paragi Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,300..700;1,6..72,300..600&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { background: linear-gradient(180deg, var(--paper-2) 0%, var(--paper) 100%); color: var(--ink); }
    .record-shell { min-height: 100vh; }
    .record-topbar { position: sticky; top: 0; z-index: 30; background: rgba(251,249,241,.92); backdrop-filter: blur(18px); border-bottom: 1px solid var(--line); }
    .record-topbar-inner { max-width: 1120px; margin: 0 auto; padding: 14px 24px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .back-link { display: inline-flex; align-items: center; gap: 10px; color: var(--ink-2); font-weight: 650; font-size: 14px; }
    .back-link:hover { color: var(--teal); }
    .record-meta { display: flex; align-items: center; gap: 14px; color: var(--muted); font-size: 13px; }
    .record-wrap { width: 100%; max-width: 1120px; margin: 0 auto; padding: 36px 24px 88px; }
    .record-hero { background: rgba(255,255,255,.86); border: 1px solid var(--line); padding: 34px; margin-bottom: 28px; box-shadow: 0 20px 60px rgba(20,23,28,.06); position: relative; }
    .record-hero:before { content: ""; position: absolute; inset: 0 auto auto 0; height: 4px; width: 100%; background: linear-gradient(90deg, var(--gold), rgba(184,152,90,.15)); }
    .record-kicker { font-family: var(--mono); font-size: 10px; letter-spacing: .22em; text-transform: uppercase; color: var(--gold); margin-bottom: 18px; }
    .record-title { font-family: var(--serif); font-size: clamp(38px, 5.4vw, 68px); font-weight: 300; line-height: .98; letter-spacing: -.045em; max-width: 15ch; margin: 0 0 18px; }
    .record-lead { font-size: clamp(17px, 2vw, 21px); line-height: 1.58; color: var(--ink-2); max-width: 62ch; }
    .record-grid { display: grid; grid-template-columns: 260px minmax(0,1fr); gap: 28px; align-items: start; }
    .record-sidebar { position: sticky; top: 92px; display: grid; gap: 18px; }
    .side-card { background: rgba(255,255,255,.82); border: 1px solid var(--line); padding: 20px; }
    .side-label { font-family: var(--mono); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; color: var(--muted-2); margin-bottom: 12px; }
    .side-list { display: grid; gap: 8px; }
    .side-list a, .side-list span { color: var(--ink-2); font-size: 14px; line-height: 1.5; }
    .side-list a:hover { color: var(--teal); }
    .tag-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .tag-row span { background: var(--tag-bg); color: var(--tag-fg); border: 1px solid rgba(0,0,0,.05); padding: 7px 10px; font-size: 12px; }
    .record-main { display: grid; gap: 24px; }
    .record-panel { background: rgba(255,255,255,.86); border: 1px solid var(--line); padding: 30px; box-shadow: 0 14px 42px rgba(20,23,28,.045); }
    .record-panel h2 { font-family: var(--mono); font-size: 12px; letter-spacing: .16em; text-transform: uppercase; font-weight: 700; color: var(--muted); margin: 0 0 16px; }
    .record-panel h3 { font-family: var(--serif); font-size: clamp(26px, 3vw, 36px); line-height: 1.02; letter-spacing: -.04em; font-weight: 300; margin: 0 0 18px; }
    .record-content h1 { display: none; }
    .record-content h2 { font-family: var(--sans); font-size: 22px; letter-spacing: -.02em; color: var(--ink); margin: 28px 0 12px; text-transform: none; }
    .record-content h3 { font-family: var(--sans); font-size: 17px; color: var(--ink-2); margin: 20px 0 10px; letter-spacing: 0; }
    .record-content p, .record-content li, .record-panel p, .record-panel li { color: var(--muted); line-height: 1.78; font-size: 15.9px; }
    .record-content ul { padding-left: 20px; }
    .record-content strong { color: var(--ink-2); }
    .record-content pre { overflow-x: auto; background: #101826; color: #f9fafb; padding: 18px; font-family: var(--mono); font-size: 13px; line-height: 1.6; }
    .record-content code { font-family: var(--mono); background: rgba(20,23,28,.06); padding: 2px 6px; }
    .notice { color: var(--muted); font-size: 14px; line-height: 1.65; }
    .bill-table-wrap { width: 100%; overflow-x: auto; border: 1px solid var(--line); background: rgba(248,247,243,.75); margin-top: 18px; }
    .bill-table { width: 100%; min-width: 720px; border-collapse: collapse; }
    .bill-table th, .bill-table td { padding: 13px 15px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
    .bill-table th { font-family: var(--mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); background: rgba(31,58,50,.05); }
    .bill-table td:first-child { width: 220px; font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); }
    .bill-table tr:last-child td { border-bottom: 0; }
    @media (max-width: 960px) { .record-grid { grid-template-columns: 1fr; } .record-sidebar { position: static; order: 2; } .record-main { order: 1; } }
    @media (max-width: 680px) { .record-wrap { padding: 24px 16px 60px; } .record-hero, .record-panel { padding: 22px 20px; } .record-topbar-inner { padding: 12px 16px; } }
  </style>
</head>
<body>
  <div class="record-shell">
    <div class="record-topbar">
      <div class="record-topbar-inner">
        <a class="back-link" href="index.html#/library">← Back to portfolio library</a>
        <div class="record-meta"><span class="brand-name"><span>Ram Paragi</span><small>Evidence record</small></span></div>
      </div>
    </div>
    <main class="record-wrap" id="artifactRoot">
      <section class="record-hero">
        <div class="record-kicker">Loading evidence record</div>
        <h1 class="record-title">Preparing artifact evidence…</h1>
        <p class="record-lead">This page presents the evidence record in a cleaner public-facing format.</p>
      </section>
    </main>
  </div>

<script>
  function neutralizePublicText(text) {
    return String(text || '')
      .replace(/my vision as\s+(?:an?\s+)?(?:Assistant\s*\/\s*Associate|Associate\s*\/\s*Assistant|Assistant|Associate)\s+Dean(?:\s+of\s+[^,.]+)?\s+is/gi, 'my vision is')
      .replace(/as\s+(?:an?\s+)?(?:Assistant\s*\/\s*Associate|Associate\s*\/\s*Assistant|Assistant|Associate)\s+Dean(?:\s+of\s+[^,.]+)?/gi, 'as an institutional leader')
      .replace(/(?:Assistant\s*\/\s*Associate|Associate\s*\/\s*Assistant|Assistant|Associate)\s+Dean(?:\s+of\s+[^,.]+)?/gi, 'institutional leadership role')
      .replace(/\bpromotion\s+goal\b/gi, 'leadership goal')
      .replace(/\bpromotion-ready\b/gi, 'leadership-ready');
  }
  function escapeHtml(str) {
    return neutralizePublicText(str || '').replace(/[&<>"']/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
  }
  function inlineMd(str) {
    let s = escapeHtml(str || '');
    s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
    s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    return s;
  }
  function stripTechnicalPreface(md) {
    let body = md || '';
    body = body.replace(/^---[\s\S]*?---\s*/, '');
    body = body.replace(/^#\s+.+\n+/, '');
    body = body.replace(/^\*\*Portfolio category:\*\*[\s\S]*?(?=\n\n|$)/m, '');
    body = body.replace(/^\*\*Portfolio role:\*\*[\s\S]*?(?=\n\n|$)/m, '');
    body = body.replace(/^\*\*Tags:\*\*[\s\S]*?(?=\n\n|$)/m, '');
    body = body.replace(/^\*\*Source evidence excerpt:\*\*[\s\S]*?(?=\n\n|\n##\s+Original Source Content|$)/m, '');
    body = body.replace(/\n##\s+Original Source Content\s*\n/i, '\n');
    return neutralizePublicText(body.trim());
  }
  function renderMarkdown(md) {
    const parts = stripTechnicalPreface(md).split(/\n/);
    let html = '';
    let inList = false, inCode = false, code = [];
    function closeList(){ if(inList){ html += '</ul>'; inList=false; } }
    function isTableSeparator(row) { return /^\s*\|?\s*:?-{3,}:?\s*(\|\s*:?-{3,}:?\s*)+\|?\s*$/.test(row); }
    function parseTableRow(row) { return row.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(cell => cell.trim().replace(/<br\s*\/?\s*>/gi, ' ')); }
    function renderTable(tableLines) {
      const rows = tableLines.filter(line => !isTableSeparator(line)).map(parseTableRow);
      if (!rows.length) return '';
      const headers = rows[0];
      const bodyRows = rows.slice(1);
      return '<div class="bill-table-wrap"><table class="bill-table"><thead><tr>' + headers.map(h => '<th>' + inlineMd(h) + '</th>').join('') + '</tr></thead><tbody>' + bodyRows.map(r => '<tr>' + headers.map((_, i) => '<td>' + inlineMd(r[i] || '') + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>';
    }
    for (let idx = 0; idx < parts.length; idx++) {
      const line = parts[idx];
      if (line.trim().startsWith('```')) {
        if (!inCode) { closeList(); inCode = true; code=[]; }
        else { html += '<pre><code>' + escapeHtml(code.join('\n')) + '</code></pre>'; inCode=false; }
        continue;
      }
      if (inCode) { code.push(line); continue; }
      if (/^\s*\|/.test(line)) {
        closeList();
        const tableLines = [line];
        while (idx + 1 < parts.length && /^\s*\|/.test(parts[idx + 1])) { idx++; tableLines.push(parts[idx]); }
        html += renderTable(tableLines); continue;
      }
      if (/^#\s+/.test(line)) { closeList(); html += '<h1>' + inlineMd(line.replace(/^#\s+/, '')) + '</h1>'; continue; }
      if (/^##\s+/.test(line)) { closeList(); html += '<h2>' + inlineMd(line.replace(/^##\s+/, '')) + '</h2>'; continue; }
      if (/^###\s+/.test(line)) { closeList(); html += '<h3>' + inlineMd(line.replace(/^###\s+/, '')) + '</h3>'; continue; }
      if (/^[-*]\s+/.test(line)) { if(!inList){ html += '<ul>'; inList=true; } html += '<li>' + inlineMd(line.replace(/^[-*]\s+/, '')) + '</li>'; continue; }
      if (/^\d+\.\s+/.test(line)) { if(!inList){ html += '<ul>'; inList=true; } html += '<li>' + inlineMd(line.replace(/^\d+\.\s+/, '')) + '</li>'; continue; }
      if (line.trim() === '') { closeList(); continue; }
      closeList(); html += '<p>' + inlineMd(line) + '</p>';
    }
    closeList();
    return html || '<p class="notice">No evidence text was available for this artifact.</p>';
  }
  function parseFrontmatter(md) {
    const match = md.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
    if (!match) return { data: {}, body: md };
    const yaml = match[1];
    const body = match[2];
    const data = {};
    let currentListKey = null;
    yaml.split(/\n/).forEach(line => {
      if (/^\s*-\s+/.test(line) && currentListKey) { data[currentListKey].push(line.replace(/^\s*-\s+/, '').replace(/^"|"$/g, '')); return; }
      const m = line.match(/^([A-Za-z0-9_]+):\s*(.*)$/);
      if (!m) return;
      const key = m[1];
      let value = m[2].trim();
      if (value === '') { data[key] = []; currentListKey = key; }
      else { currentListKey = null; value = value.replace(/^"|"$/g, ''); data[key] = value; }
    });
    return { data, body };
  }
  function extractLabeledFields(body) {
    const titleMatch = body.match(/^#\s+(.+)$/m);
    const get = (label) => {
      const re = new RegExp('\\*\\*' + label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ':\\*\\*\\s*([\\s\\S]*?)(?=\\n\\n|\\n##\\s|$)');
      const m = body.match(re);
      return m ? neutralizePublicText(m[1].trim()) : '';
    };
    return {
      title: titleMatch ? neutralizePublicText(titleMatch[1].trim()) : '',
      portfolioCategory: get('Portfolio category'),
      portfolioRole: get('Portfolio role'),
      tagsText: get('Tags'),
      excerpt: get('Source evidence excerpt')
    };
  }
  function chipsFromMeta(meta) {
    const chips = [];
    if (meta.publication_status) chips.push(`<span>${escapeHtml(meta.publication_status)}</span>`);
    if (meta.confidentiality_review) chips.push(`<span>${escapeHtml(meta.confidentiality_review)}</span>`);
    return chips.join('');
  }
  function buildPage(meta, fields, file, md) {
    const title = neutralizePublicText(meta.title || fields.title || 'Untitled artifact');
    const category = meta.category || fields.portfolioCategory || 'Portfolio artifact';
    const role = meta.portfolio_role || fields.portfolioRole || 'Evidence artifact';
    const tags = Array.isArray(meta.tags) ? meta.tags : (fields.tagsText ? fields.tagsText.split(/,\s*/) : []);
    const lead = fields.excerpt || 'This artifact documents a substantive body of institutional work and is presented here as a public-facing evidence record.';
    return `
      <section class="record-hero">
        <div class="record-kicker">Evidence record</div>
        <h1 class="record-title">${escapeHtml(title)}</h1>
        <p class="record-lead">${inlineMd(lead)}</p>
      </section>
      <div class="record-grid">
        <aside class="record-sidebar">
          <div class="side-card">
            <div class="side-label">On this page</div>
            <div class="side-list">
              <a href="#overview">Executive overview</a>
              <a href="#evidence">Evidence record</a>
            </div>
          </div>
          <div class="side-card">
            <div class="side-label">Positioning</div>
            <div class="side-list">
              <span><strong>Category</strong><br>${escapeHtml(category)}</span>
              <span><strong>Portfolio role</strong><br>${escapeHtml(role)}</span>
            </div>
          </div>
          ${tags.length ? `<div class="side-card"><div class="side-label">Key themes</div><div class="tag-row">${tags.map(t => `<span>${escapeHtml(t)}</span>`).join('')}</div></div>` : ''}
        </aside>
        <div class="record-main">
          <section class="record-panel" id="overview">
            <h2>Executive overview</h2>
            <h3>Why this artifact matters</h3>
            <p>${inlineMd(lead)}</p>
            <div class="tag-row" style="margin-top:18px">${chipsFromMeta(meta)}</div>
          </section>
          <section class="record-panel" id="evidence">
            <h2>Evidence record</h2>
            <h3>Supporting evidence text</h3>
            <div class="record-content">${renderMarkdown(md)}</div>
          </section>
        </div>
      </div>`;
  }
  const params = new URLSearchParams(location.search);
  const file = params.get('file');
  const root = document.getElementById('artifactRoot');
  if (!file || file.includes('..') || file.includes('/') || file.includes('\\')) {
    root.innerHTML = `<section class="record-hero"><div class="record-kicker">Artifact error</div><h1 class="record-title">Artifact not found</h1><p class="record-lead">The artifact file parameter is missing or invalid.</p></section>`;
  } else {
    fetch('content/artifacts_cleaned_82/' + encodeURIComponent(file))
      .then(r => { if (!r.ok) throw new Error('Could not load file'); return r.text(); })
      .then(md => {
        const parsed = parseFrontmatter(md);
        const fields = extractLabeledFields(parsed.body);
        root.innerHTML = buildPage(parsed.data, fields, file, md);
      })
      .catch(err => {
        root.innerHTML = `<section class="record-hero"><div class="record-kicker">Artifact error</div><h1 class="record-title">Artifact not found</h1><p class="record-lead">${escapeHtml(err.message)}</p></section>`;
      });
  }
</script>
</body>
</html>
