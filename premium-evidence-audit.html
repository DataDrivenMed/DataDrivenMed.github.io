<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Premium Evidence Audit</title><style>body{font-family:Arial,sans-serif;margin:32px;line-height:1.45;color:#111}h1{margin-bottom:8px}.ok{color:#0a6}.bad{color:#b00}.meta{padding:16px;background:#f4f4f4;border-radius:8px;margin:18px 0}.row{padding:9px 0;border-bottom:1px solid #ddd}.id{font-family:monospace;color:#666;font-size:12px}.new{font-weight:700}</style></head><body><h1>Premium Evidence Runtime Audit</h1><p>This page verifies the evidence array actually loaded in the premium clone. It does not modify the live portfolio.</p><div id="audit">Loading…</div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script><script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script><script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script type="text/babel" data-presets="env,react" src="src/data.jsx"></script><script type="text/babel" data-presets="env,react" src="src/ai-ready-hiring-patch.jsx"></script><script type="text/babel" data-presets="env,react" src="src/ai-triage-artifact-patch.jsx"></script><script type="text/babel" data-presets="env,react" src="src/prototype-artifacts.jsx"></script><script type="text/babel" data-presets="env,react" src="src/genai-atlas-patch.jsx"></script><script type="text/babel" data-presets="env,react" src="src/rht-stress-test-patch.jsx"></script><script type="text/babel" data-presets="env,react" src="src/ai-architecture-guide-patch.jsx"></script><script src="src/amc-guide-direct.js"></script><script src="src/ai-resources-final.js"></script><script type="text/babel" data-presets="env,react" src="src/ai-library-rescue.jsx"></script><script type="text/babel" data-presets="env,react" src="src/consultation-patch.jsx"></script><script src="src/premium-evidence.js"></script><script src="src/premium-evidence-expanded.js"></script><script src="src/premium-evidence-final.js"></script>
<script>window.addEventListener('load',function(){setTimeout(function(){var a=window.ARTIFACTS||[];var d=window.PREMIUM_RUNTIME_DIAGNOSTICS||{};var el=document.getElementById('audit');var html='<div class="meta"><strong>Total loaded records: '+a.length+'</strong><br>Protected baseline: 97<br>Added/normalized above baseline: '+Math.max(0,a.length-97)+'<br>Runtime sentinel check: <span class="'+(d.passed?'ok':'bad')+'">'+(d.passed?'PASS':'FAIL')+'</span>'+(d.missingSentinels&&d.missingSentinels.length?'<br>Missing sentinels: '+d.missingSentinels.join(', '):'')+'</div>';html+='<h2>Loaded evidence records</h2>';a.slice().sort(function(x,y){return (x.title||'').localeCompare(y.title||'')}).forEach(function(x){html+='<div class="row '+(x.premiumEvidence?'new':'')+'"><div>'+(x.title||'(untitled)')+'</div><div class="id">'+x.id+(x.premiumEvidence?' · normalized/premium':' · preserved baseline')+'</div></div>'});el.innerHTML=html;},800);});</script></body></html>
